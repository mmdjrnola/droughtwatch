name: Update Drought Data

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scraper
        run: python scrape.py

      - name: Commit and push updated data
        run: |
          git config user.name "DroughtWatch Bot"
          git config user.email "bot@droughtwatch"
                    git pull --rebase

          git add data/drought.json
          git diff --cached --quiet || git commit -m "chore: update drought data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force
