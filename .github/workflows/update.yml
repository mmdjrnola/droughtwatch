name: Update Drought Data

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python scrape.py

      - run: |
          git config user.name "DroughtWatch Bot"
          git config user.email "bot@droughtwatch"
          git add data/drought.json
          git diff --cached --quiet || git commit -m "update drought data"
          git push --force origin main
